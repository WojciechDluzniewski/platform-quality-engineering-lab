openapi: 3.0.3
info:
  title: User Service API
  version: "1.0.0"

paths:
  /users/{user_id}:
    get:
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - is_active
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean